<header class="app-header">
  <div class="header-brand" (click)="routeTo('')">
    <img alt="Rungika logo" src="./../../../assets/logo.png" />
    <span class="brand-name">Rungika</span>
  </div>

  @if (!credentials.loggedIn) {
    <div class="header-auth">
      <div class="auth-group">
        <button type="button" class="btn-login auth-link" [class.active]="isSelected('/login')" (click)="routeTo('login')">
          <mat-icon class="auth-icon">login</mat-icon>
          <span>Log in</span>
        </button>
        <button type="button" class="btn-signup auth-cta" (click)="routeTo('signup')">
          <mat-icon class="auth-icon">person_add</mat-icon>
          <span>Sign up</span>
        </button>
      </div>
    </div>
  }

  @if (credentials.loggedIn) {
    <div class="header-auth">
      <a class="account-link" routerLink="/account-details">{{ credentials.firstName }}</a>
    </div>
  }
</header>

@if (showToast) {
  <div class="global-toast">
    {{ toastMessage }}
  </div>
}

<main class="app-main">
  <router-outlet></router-outlet>
</main>
