<h2 mat-dialog-title>Change Password</h2>

<mat-dialog-content>
  <form [formGroup]="passwordForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Current Password</mat-label>
      <mat-icon matPrefix>lock_outline</mat-icon>
      <input 
        [type]="hideCurrentPassword ? 'password' : 'text'" 
        matInput 
        formControlName="currentPassword"
        placeholder="Enter your current password">
      <button 
        type="button" 
        mat-icon-button 
        matSuffix 
        (click)="togglePasswordVisibility('current')">
        <mat-icon>{{ hideCurrentPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="passwordForm.get('currentPassword')?.hasError('required')">
        Current password is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New Password</mat-label>
      <mat-icon matPrefix>lock_outline</mat-icon>
      <input 
        [type]="hideNewPassword ? 'password' : 'text'" 
        matInput 
        formControlName="newPassword"
        placeholder="Enter your new password">
      <button 
        type="button" 
        mat-icon-button 
        matSuffix 
        (click)="togglePasswordVisibility('new')">
        <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="getPasswordError() as error">{{ error }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm New Password</mat-label>
      <mat-icon matPrefix>lock_outline</mat-icon>
      <input 
        [type]="hideConfirmPassword ? 'password' : 'text'" 
        matInput 
        formControlName="confirmPassword"
        placeholder="Confirm your new password">
      <button 
        type="button" 
        mat-icon-button 
        matSuffix 
        (click)="togglePasswordVisibility('confirm')">
        <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="getConfirmPasswordError() as error">{{ error }}</mat-error>
    </mat-form-field>
  </form>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
  <button 
    mat-raised-button 
    color="primary" 
    (click)="onSubmit()"
    [disabled]="!passwordForm.valid || isSubmitting">
    {{ isSubmitting ? 'Updating...' : 'Update Password' }}
  </button>
  <br>
</mat-dialog-actions>
