<h2 mat-dialog-title>Reset Password</h2>

<mat-dialog-content>
  <p class="dialog-copy">
    Enter the email address on your account and we will send you a password reset link.
  </p>

  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email address</mat-label>
      <mat-icon matPrefix>email</mat-icon>
      <input matInput type="email" formControlName="email" placeholder="name@example.com" autofocus>
      <mat-error *ngIf="emailControl?.hasError('required')">Email is required</mat-error>
      <mat-error *ngIf="emailControl?.hasError('email')">Enter a valid email address</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" type="button" (click)="onSubmit()">
    Send reset link
  </button>
</mat-dialog-actions>
