server.port: 9000

stripe:
  public.key: placeholder
  secret.key: placeholder

exchange:
  rate:
    api:
      url: ${EXCHANGE_RATE_API_URL:https://open.er-api.com/v6/latest/}
      timeout: 5000
    cache:
        ttl:
          minutes: 30

spring:
  data.mongodb:
    uri: placeholder
    database: placeholder

email:
  notification:
    enabled: true

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

jwt:
  cookieName: placeholder
  cookieSameSite: ${JWT_COOKIE_SAME_SITE:Lax}
  cookieSecure: ${JWT_COOKIE_SECURE:false}
  secret: placeholder
  expirationMs: 86400000

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${app.frontend-url}}
  cancel-url: ${APP_FRONTEND_URL}/#/payment-failed
  success-url: ${APP_FRONTEND_URL}/#/success

admin:
  seed:
    emails: email1, email2
    sync-user-roles: true